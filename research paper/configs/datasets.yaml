# Registry of raw inputs for the audit stage.
# Paths are relative to the project root. Raw files are IMMUTABLE inputs:
# no script may modify, rename, move, or extract over them.
#
# Evidence levels: VERIFIED | DOCUMENTED | HYPOTHESIS | UNRESOLVED
# (see reports/dataset_provenance.md for the evidence behind each field)

sources:
  - path: CICIDS2017_improved.zip
    dataset_family: CIC-IDS-2017
    variant: improved
    release: "CNS2022 improved release, server Last-Modified 2023-04-27 14:41:35 GMT"
    release_status: VERIFIED          # byte size matches server Content-Length (checked 2026-10-19)
    source_url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/CICIDS2017_improved.zip
    role: raw_improved

  - path: CSECICIDS2018_improved.zip
    dataset_family: CSE-CIC-IDS-2018
    variant: improved
    release: "CNS2022 improved release, server Last-Modified 2023-04-03 14:53:27 GMT"
    release_status: VERIFIED          # byte size matches server Content-Length (checked 2026-10-19)
    source_url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/CSECICIDS2018_improved.zip
    role: raw_improved

  - path: Error_Prevalence_in_NIDS_datasets_A_Case_Study_on_CIC-IDS-2017_and_CSE-CIC-IDS-2018.pdf
    dataset_family: both
    variant: documentation
    release: "Liu, Engelen, Lynar, Essam, Joosen. IEEE CNS 2022, pp. 254-263, DOI 10.1109/CNS56114.2022.9947235"
    release_status: VERIFIED          # read from the local PDF
    source_url: https://ieeexplore.ieee.org/abstract/document/9947235
    role: reference_paper

